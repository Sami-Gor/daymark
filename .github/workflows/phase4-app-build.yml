name: Phase 4 Full Application Build

on:
  workflow_dispatch:
  push:
    branches:
      - security/p0-phase4-app

permissions:
  contents: read

jobs:
  phase4-app:
    name: Build Phase 4 validation application
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter @workspace/weather-app run build
        env:
          PORT: 5173
          BASE_PATH: /
      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android
      - name: Verify Android web assets
        run: pnpm --filter @workspace/weather-app run verify:android-web-assets
      - name: Set validation package and minSdk
        run: |
          sed -i 's/minSdkVersion = 29/minSdkVersion = 24/' artifacts/weather-app/android/variables.gradle
          grep -n 'minSdkVersion' artifacts/weather-app/android/variables.gradle | head -1
      - name: Verify adopted AAR identity
        run: |
          AAR=artifacts/weather-app/android/daymark-voice/libs/sherpa-onnx-1.13.8-daymark-cve-2026-108954.aar
          echo "8e1edb57a5ac1e779dd6b00a6267a2305e44e1ef1620095626e9c93e9497a398  $AAR" | sha256sum -c -
          unzip -p "$AAR" jni/arm64-v8a/libsherpa-onnx-jni.so | sha256sum
          echo "3611bbe18d282afc95bd5e4b8edf8f9f49f09d2148bf084c4878f6c390457cfb  -" | sha256sum -c -
      - name: Fetch pinned Parakeet model
        id: model
        continue-on-error: true
        run: android/kokoro-poc/scripts/fetch-parakeet-assets.sh
      - name: Build Phase 4 debug APK
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:assembleDebug -PdaymarkApplicationId=io.github.sami_gor.daymark.phase4validate
      - name: Build Phase 4 debug AAB if model staged
        if: ${{ steps.model.outcome == 'success' }}
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:bundleDebug -PdaymarkApplicationId=io.github.sami_gor.daymark.phase4validate
      - name: Verify and stage APK/AAB
        run: |
          APK=$(find artifacts/weather-app/android/app/build/outputs/apk -name '*.apk' | head -1)
          sha256sum "$APK" | tee phase4-apk.sha256
          cp "$APK" phase4-app-debug.apk
          if [ -f artifacts/weather-app/android/app/build/outputs/bundle/debug/app-debug.aab ]; then
            sha256sum artifacts/weather-app/android/app/build/outputs/bundle/debug/app-debug.aab | tee phase4-aab.sha256
            cp artifacts/weather-app/android/app/build/outputs/bundle/debug/app-debug.aab phase4-app-debug.aab
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-app
          path: |
            phase4-app-debug.apk
            phase4-app-debug.aab
            phase4-apk.sha256
            phase4-aab.sha256
          if-no-files-found: error
