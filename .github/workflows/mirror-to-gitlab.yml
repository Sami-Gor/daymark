name: Mirror to GitLab

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: gitlab-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.actor != 'dependabot[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
      REPO_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Clone GitHub repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git clone --bare \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo.git

      - name: Push branches and tags to GitLab
        run: |
          set -euo pipefail

          cd repo.git

          DEST="https://oauth2:${GITLAB_TOKEN}@gitlab.com/Sami-Gor/${REPO_NAME}.git"

          # Publish every GitHub branch and tag, one ref at a time. A
          # non-fast-forward rejection on one branch must not prevent
          # unrelated refs from being attempted. The step still fails after
          # all refs have been attempted if any source ref was not mirrored.
          #
          # No --force and no --prune are used. A GitLab-only branch or tag is
          # intentionally left alone, and a divergent branch must be resolved
          # explicitly rather than being overwritten by this workflow.
          failed_refs=()

          push_ref() {
            local ref="$1"
            echo "::group::Push ${ref}"
            if git push --porcelain "$DEST" "${ref}:${ref}"; then
              echo "Mirrored ${ref}"
            else
              echo "::error::Mirror failed for ${ref}"
              failed_refs+=("$ref")
            fi
            echo "::endgroup::"
          }

          while IFS= read -r ref; do
            push_ref "$ref"
          done < <(git for-each-ref --format='%(refname)' refs/heads refs/tags)

          if (( ${#failed_refs[@]} > 0 )); then
            {
              echo "### Mirror failures"
              printf -- '- `%s`\n' "${failed_refs[@]}"
              echo
              echo "No force push was attempted. Resolve each divergence explicitly."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${#failed_refs[@]} ref(s) failed to mirror"
            exit 1
          fi

      - name: Verify default branch
        if: always()
        run: |
          set -euo pipefail

          cd repo.git

          DEST="https://oauth2:${GITLAB_TOKEN}@gitlab.com/Sami-Gor/${REPO_NAME}.git"

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          SOURCE_SHA="$(git rev-parse "refs/heads/${DEFAULT_BRANCH}")"
          DEST_SHA="$(git ls-remote "$DEST" "refs/heads/${DEFAULT_BRANCH}" | awk '{print $1}')"

          echo "GitHub ${DEFAULT_BRANCH}: ${SOURCE_SHA}"
          echo "GitLab ${DEFAULT_BRANCH}: ${DEST_SHA}"

          {
            echo "### Default-branch verification"
            echo "- GitHub: \`${DEFAULT_BRANCH}\` = \`${SOURCE_SHA}\`"
            echo "- GitLab: \`${DEFAULT_BRANCH}\` = \`${DEST_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SOURCE_SHA" != "$DEST_SHA" ]; then
            echo "::error::GitHub and GitLab default-branch SHAs differ"
            exit 1
          fi
