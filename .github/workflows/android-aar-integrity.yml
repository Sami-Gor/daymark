name: Android AAR integrity

# Fail-closed verification of the committed sherpa-onnx Android runtime.
#
# The DaymarkVoice module consumes
#   artifacts/weather-app/android/daymark-voice/libs/
#     sherpa-onnx-1.13.8-daymark-cve-2026-108954.aar
# as a local file dependency. That AAR is a locally rebuilt v1.13.8 runtime
# carrying the joiner-width validation for CVE-2026-108954 / GHSA-f5q5-vp8g-wh4x;
# upstream v1.13.8, v2.0.1 and master still contain the unchecked width access.
# A substituted or rebuilt-without-the-patch artifact silently reintroduces the
# vulnerability.
#
# The digest is pinned in daymark-voice/sherpa-aar.sha256 and is checked by the
# Gradle verifySherpaAar task; android/kokoro-poc/scripts/fetch-sherpa-onnx.sh
# reads this same pin for CI provisioning. It cannot be redirected: the gate
# takes fixed project-relative paths and rejects the legacy override
# properties. This workflow runs the gate
# itself, the positive/negative test suite for it, and asserts that release
# builds depend on it while debug builds and JVM unit tests do not.
#
# This is a separate workflow rather than extra steps in android-ci.yml so a
# Gradle or runner problem here cannot block the required `verify` check.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # The voice module, its pinned runtime, the app module and the gate.
      - 'artifacts/weather-app/android/daymark-voice/**'
      - 'artifacts/weather-app/android/app/**'
      - 'artifacts/weather-app/android/gradle/**'
      - 'artifacts/weather-app/android/tools/sherpa-aar-integrity/**'
      - 'artifacts/weather-app/android/parakeet-assets/**'
      # Root Gradle files of the Android project.
      - 'artifacts/weather-app/android/build.gradle'
      - 'artifacts/weather-app/android/settings.gradle'
      - 'artifacts/weather-app/android/variables.gradle'
      - 'artifacts/weather-app/android/gradle.properties'
      - 'artifacts/weather-app/android/capacitor.settings.gradle'
      # CI-side provisioning script and other Android tooling.
      - 'android/**'
      # Workspace inputs needed to regenerate the Capacitor Android project.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android-aar-integrity.yml'

permissions:
  contents: read

concurrency:
  group: android-aar-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Digest, fail-closed negative cases and the full 17-case harness.
  #
  # The harness also has three cross-module cases that configure the real
  # Android Gradle project, so this job regenerates the Capacitor-managed
  # Android modules (pnpm install, web build, cap sync) before running it.
  # The hosted runner provides the Android SDK and JDK 21.
  #
  # The Parakeet model is deliberately not fetched: it is about 640 MiB and
  # unrelated to the AAR digest gate. The model-presence guard in
  # :parakeet-assets is skipped for --dry-run, which is all these graph
  # assertions execute, so the cross-module cases stay active without it;
  # real packaging still fails closed when the model is absent.
  #
  # The same harness run also proves the gate cannot be redirected from
  # Gradle project properties (the cases mutate a copy and assert that -P flags
  # and gradle.properties are rejected) and that fetch-sherpa-onnx.sh reads the
  # committed pin instead of carrying a duplicate digest.
  digest-and-tests:
    name: aar-digest-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The gate and the test suite run on a plain JVM; Java 21 matches the
      # Android modules' source/target level.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The pin file is sha256sum(1) format. Checking it here also proves the
      # committed artifact and the pin still agree outside Gradle.
      - name: Check the committed AAR against the pin (sha256sum format)
        working-directory: artifacts/weather-app/android/daymark-voice/libs
        run: |
          grep -v '^[[:space:]]*#' ../sherpa-aar.sha256 | sha256sum -c -

      # SHA-pinned third-party action; b906aff is the v4 tag commit.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Gradle cannot configure the project until the Capacitor-managed
      # modules exist: settings.gradle includes capacitor-android from
      # node_modules and the cordova plugin project generated by cap sync.
      - name: Build web assets
        run: pnpm --filter @workspace/weather-app run build
        env:
          PORT: 5173
          BASE_PATH: /

      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android

      # Positive case (the committed AAR passes), every negative case (missing,
      # mutated, wrong or malformed pin, path traversal) and the release-only
      # wiring assertions, including the cross-module :app graphs.
      - name: Run the AAR integrity test suite
        working-directory: artifacts/weather-app/android/tools/sherpa-aar-integrity
        run: ./run-tests.sh
        env:
          OUT_DIR: ${{ runner.temp }}/aar-integrity-tests

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aar-integrity-test-logs
          path: ${{ runner.temp }}/aar-integrity-tests
          if-no-files-found: ignore

  # Runs the gate inside the real Android Gradle project (the same project and
  # task graph android-ci.yml builds) and asserts the release/debug wiring.
  release-wiring:
    name: release-wiring
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # SHA-pinned third-party action; b906aff is the v4 tag commit.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Gradle cannot configure the project until the Capacitor-managed
      # modules exist: settings.gradle includes capacitor-android from
      # node_modules and the cordova plugin project generated by cap sync.
      - name: Build web assets
        run: pnpm --filter @workspace/weather-app run build
        env:
          PORT: 5173
          BASE_PATH: /

      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android

      - name: Verify the committed sherpa-onnx AAR (Gradle)
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :daymark-voice:verifySherpaAar

      # The gate must not be redirectable from Gradle project properties:
      # -P flags and gradle.properties are both project properties. The
      # harness exercises the mutation scenarios with a tampered artifact;
      # this quick check keeps the guarantee in the release workflow too.
      - name: Assert the AAR gate cannot be redirected
        working-directory: artifacts/weather-app/android
        run: |
          set -euo pipefail
          if ./gradlew --no-daemon --console=plain :daymark-voice:verifySherpaAar \
              -PsherpaAarDir=/tmp/not-the-aar-dir/libs \
              -PsherpaAarPinFile=/tmp/not-the-pin.sha256 > /tmp/aar-override-check.log 2>&1; then
            echo "error: Gradle project properties redirected the AAR integrity gate." >&2
            exit 1
          fi
          grep -q 'Unsupported sherpa-onnx AAR integrity override' /tmp/aar-override-check.log

      # Release builds must depend on the gate. --dry-run prints the task graph
      # without building, so this stays cheap while still proving the wiring.
      - name: Assert release builds depend on the gate
        working-directory: artifacts/weather-app/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :daymark-voice:assembleRelease --dry-run | tee /tmp/release-tasks.txt
          grep -q 'verifySherpaAar' /tmp/release-tasks.txt

      # The app module packages the runtime through :daymark-voice. Assert its
      # release pre-build hook and its full release graph directly, so a
      # regression in the cross-module wiring cannot pass unnoticed.
      #
      # The Parakeet model is not fetched in this workflow (640 MiB, unrelated
      # to the AAR gate). The model-presence guard in :parakeet-assets skips
      # --dry-run, so the full :app release graph can be asserted without it;
      # real packaging still fails closed when the model is absent.
      - name: Assert app release builds depend on the gate
        working-directory: artifacts/weather-app/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:preReleaseBuild --dry-run | tee /tmp/app-prerelease-tasks.txt
          grep -q ':daymark-voice:verifySherpaAar' /tmp/app-prerelease-tasks.txt
          ./gradlew --no-daemon --console=plain :app:assembleRelease --dry-run | tee /tmp/app-release-tasks.txt
          grep -q ':daymark-voice:verifySherpaAar' /tmp/app-release-tasks.txt

      # Debug builds and JVM unit tests must not be wired: local debug work and
      # :app:testDebugUnitTest have to keep working without the release gate.
      - name: Assert debug builds and unit tests are not wired
        working-directory: artifacts/weather-app/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :daymark-voice:preDebugBuild --dry-run > /tmp/debug-tasks.txt
          if grep -q 'verifySherpaAar' /tmp/debug-tasks.txt; then
            echo "error: the AAR integrity gate is wired into a debug build path." >&2
            exit 1
          fi
          ./gradlew --no-daemon --console=plain :app:assembleDebug --dry-run > /tmp/app-debug-tasks.txt
          if grep -q 'verifySherpaAar' /tmp/app-debug-tasks.txt; then
            echo "error: the AAR integrity gate is wired into the app debug build." >&2
            exit 1
          fi
