name: Release Candidate Verification

# Exact-SHA hosted verification. The workflow lives on main but every job
# checks out the approved release candidate by full SHA and verifies HEAD.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full 40-character candidate SHA (approved Daymark 2.1.0 candidate)
        required: true
        default: 8a28892fec6903b765882a8ee5bf470ce6f0200b
        type: string

permissions:
  contents: read
  security-events: write

concurrency:
  group: release-candidate-verification-${{ inputs.candidate_sha }}
  cancel-in-progress: true

env:
  APPROVED_CANDIDATE_SHA: 8a28892fec6903b765882a8ee5bf470ce6f0200b

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.validate.outputs.candidate_sha }}
      tree_sha: ${{ steps.verify.outputs.tree_sha }}
    steps:
      - name: Validate candidate SHA input
        id: validate
        env:
          INPUT_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if ! printf "%s" "$INPUT_SHA" | grep -Eq "^[0-9a-f]{40}$"; then
            echo "::error::candidate_sha must be a full 40-character lowercase SHA"
            exit 1
          fi
          if [ "$INPUT_SHA" != "$APPROVED_CANDIDATE_SHA" ]; then
            echo "::error::candidate_sha $INPUT_SHA is not the approved release candidate"
            exit 1
          fi
          echo "candidate_sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out source
        id: verify
        env:
          EXPECTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          test "$actual" = "$EXPECTED_SHA" || { echo "::error::checked-out $actual != requested $EXPECTED_SHA"; exit 1; }
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          echo "tree_sha=$tree" >> "$GITHUB_OUTPUT"
          echo "checked_out_sha=$actual"
          echo "candidate_tree_sha=$tree"
          { echo "### Release candidate preflight"; echo "- candidate: $actual"; echo "- tree: $tree"; echo "- tracked changes: none"; } >> "$GITHUB_STEP_SUMMARY"

  classify-model-dependency:
    name: classify-model-dependency
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected="$EXPECTED_CANDIDATE_SHA"
          test "$actual" = "$expected" || { echo "::error::checked-out $actual != requested $expected"; exit 1; }
          echo "checked_out_sha=$actual"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          { echo "### Candidate checkout"; echo "- requested: $expected"; echo "- actual: $actual"; echo "- tree: $(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classifier tests
        run: node --test scripts/ci/classify-model-dependency.test.mjs
      - name: Classify candidate release commit
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD^)
          head=$(git rev-parse HEAD)
          node scripts/ci/classify-model-dependency.mjs --event push --before "$before" --push-head "$head" --output classification.json
          test -s classification.json
          cat classification.json
          { echo "### Classifier decision"; echo "- before: $before"; echo "- head: $head"; echo "- classification: $(cat classification.json)"; } >> "$GITHUB_STEP_SUMMARY"

  model-independent:
    name: model-independent
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected="$EXPECTED_CANDIDATE_SHA"
          test "$actual" = "$expected" || { echo "::error::checked-out $actual != requested $expected"; exit 1; }
          echo "checked_out_sha=$actual"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          { echo "### Candidate checkout"; echo "- requested: $expected"; echo "- actual: $actual"; echo "- tree: $(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter @workspace/weather-app run build
        env:
          PORT: 5173
          BASE_PATH: /
      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android
      - name: Verify Android web assets
        run: pnpm --filter @workspace/weather-app run verify:android-web-assets
      - name: Unit tests
        run: pnpm --filter @workspace/weather-app run test
      - name: Android JVM tests and lint
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :daymark-voice:testDebugUnitTest :app:lintDebug
      - name: Install Playwright browser
        run: pnpm --filter @workspace/weather-app exec playwright install chromium --with-deps
      - name: Browser tests
        run: pnpm --filter @workspace/weather-app run test:e2e
        env:
          PORT: 5173
          BASE_PATH: /
          CI: 1
      - name: Dependency audit
        run: pnpm audit --audit-level critical
      - name: Docs validation
        run: node scripts/ci/validate-docs.mjs
      - name: Validate workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].sort.each { |f| Psych.parse_file(f); puts "yaml ok: " + f }'

  model-dependent:
    name: model-dependent
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected="$EXPECTED_CANDIDATE_SHA"
          test "$actual" = "$expected" || { echo "::error::checked-out $actual != requested $expected"; exit 1; }
          echo "checked_out_sha=$actual"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          { echo "### Candidate checkout"; echo "- requested: $expected"; echo "- actual: $actual"; echo "- tree: $(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter @workspace/weather-app run build
        env:
          PORT: 5173
          BASE_PATH: /
      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android
      - name: Verify Android web assets
        run: pnpm --filter @workspace/weather-app run verify:android-web-assets
      - name: Fetch sherpa-onnx runtime
        run: android/kokoro-poc/scripts/fetch-sherpa-onnx.sh
      - name: Fetch Parakeet model assets
        run: android/kokoro-poc/scripts/fetch-parakeet-assets.sh
      - name: Android model packaging
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :parakeet-assets:verifyParakeetAssets :app:assembleDebug :app:bundleDebug

  android:
    name: android-ci
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected="$EXPECTED_CANDIDATE_SHA"
          test "$actual" = "$expected" || { echo "::error::checked-out $actual != requested $expected"; exit 1; }
          echo "checked_out_sha=$actual"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          { echo "### Candidate checkout"; echo "- requested: $expected"; echo "- actual: $actual"; echo "- tree: $(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter @workspace/weather-app run build
        env:
          PORT: 5173
          BASE_PATH: /
      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android
      - name: Verify Android web assets
        run: pnpm --filter @workspace/weather-app run verify:android-web-assets
      - name: Fetch the sherpa-onnx runtime
        run: android/kokoro-poc/scripts/fetch-sherpa-onnx.sh
      - name: Verify the sherpa-onnx runtime
        run: |
          module=artifacts/weather-app/android/daymark-voice
          if ! grep -q "libs/sherpa-onnx-.*\.aar" "$module/build.gradle" 2>/dev/null; then
            echo "::notice::$module does not declare the sherpa-onnx runtime; nothing to verify."
            exit 0
          fi
          if ! compgen -G "$module/libs/sherpa-onnx-*.aar" >/dev/null; then
            echo "error: $module declares the sherpa-onnx runtime but no AAR is installed." >&2
            exit 1
          fi
          ls -l "$module"/libs/sherpa-onnx-*.aar
      - name: Android unit tests
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :daymark-voice:testDebugUnitTest
      - name: Fetch Parakeet model assets
        run: android/kokoro-poc/scripts/fetch-parakeet-assets.sh
      - name: Android debug APK and AAB
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleDebug
      - name: Android lint
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:lintDebug

  codeql-javascript:
    name: codeql-javascript-typescript-actions
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected="$EXPECTED_CANDIDATE_SHA"
          test "$actual" = "$expected" || { echo "::error::checked-out $actual != requested $expected"; exit 1; }
          echo "checked_out_sha=$actual"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          { echo "### Candidate checkout"; echo "- requested: $expected"; echo "- actual: $actual"; echo "- tree: $(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript,actions
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: ${{ runner.temp }}/codeql-js
          category: /language:javascript-typescript
      - name: Upload candidate SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-js-sarif-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/codeql-js
          if-no-files-found: ignore
      - name: Upload candidate SARIF to code scanning with candidate ref/SHA
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-js
          checkout_path: ${{ github.workspace }}
          ref: refs/heads/release/v2-candidate
          sha: ${{ inputs.candidate_sha }}
          category: /language:javascript-typescript
          wait-for-processing: false

  codeql-java:
    name: codeql-java-kotlin
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected="$EXPECTED_CANDIDATE_SHA"
          test "$actual" = "$expected" || { echo "::error::checked-out $actual != requested $expected"; exit 1; }
          echo "checked_out_sha=$actual"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          { echo "### Candidate checkout"; echo "- requested: $expected"; echo "- actual: $actual"; echo "- tree: $(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: ${{ runner.temp }}/codeql-java
          category: /language:java-kotlin
      - name: Upload candidate SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-java-sarif-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/codeql-java
          if-no-files-found: ignore
      - name: Upload candidate SARIF to code scanning with candidate ref/SHA
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-java
          checkout_path: ${{ github.workspace }}
          ref: refs/heads/release/v2-candidate
          sha: ${{ inputs.candidate_sha }}
          category: /language:java-kotlin
          wait-for-processing: false

  aar-digest-and-tests:
    name: aar-digest-and-tests
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected="$EXPECTED_CANDIDATE_SHA"
          test "$actual" = "$expected" || { echo "::error::checked-out $actual != requested $expected"; exit 1; }
          echo "checked_out_sha=$actual"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          { echo "### Candidate checkout"; echo "- requested: $expected"; echo "- actual: $actual"; echo "- tree: $(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the committed AAR against the pin (sha256sum format)
        working-directory: artifacts/weather-app/android/daymark-voice/libs
        run: |
          grep -v '^[[:space:]]*#' ../sherpa-aar.sha256 | sha256sum -c -
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter @workspace/weather-app run build
        env:
          PORT: 5173
          BASE_PATH: /
      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android
      - name: Run the AAR integrity test suite
        working-directory: artifacts/weather-app/android/tools/sherpa-aar-integrity
        run: ./run-tests.sh
        env:
          OUT_DIR: ${{ runner.temp }}/aar-integrity-tests
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aar-integrity-test-logs-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/aar-integrity-tests
          if-no-files-found: ignore

  release-wiring:
    name: release-wiring
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Verify checked-out candidate
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          expected="$EXPECTED_CANDIDATE_SHA"
          test "$actual" = "$expected" || { echo "::error::checked-out $actual != requested $expected"; exit 1; }
          echo "checked_out_sha=$actual"
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)" || { echo "::error::candidate checkout has tracked modifications"; git status --porcelain; exit 1; }
          { echo "### Candidate checkout"; echo "- requested: $expected"; echo "- actual: $actual"; echo "- tree: $(git rev-parse 'HEAD^{tree}')"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        run: pnpm --filter @workspace/weather-app run build
        env:
          PORT: 5173
          BASE_PATH: /
      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android
      - name: Verify the committed sherpa-onnx AAR (Gradle)
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :daymark-voice:verifySherpaAar
      - name: Assert the AAR gate cannot be redirected
        working-directory: artifacts/weather-app/android
        run: |
          set -euo pipefail
          if ./gradlew --no-daemon --console=plain :daymark-voice:verifySherpaAar \
              -PsherpaAarDir=/tmp/not-the-aar-dir/libs \
              -PsherpaAarPinFile=/tmp/not-the-pin.sha256 > /tmp/aar-override-check.log 2>&1; then
            echo "error: Gradle project properties redirected the AAR integrity gate." >&2
            exit 1
          fi
          grep -q 'Unsupported sherpa-onnx AAR integrity override' /tmp/aar-override-check.log
          if ORG_GRADLE_PROJECT_sherpaAarPinFile=/tmp/not-the-pin.sha256 \
              ./gradlew --no-daemon --console=plain :daymark-voice:verifySherpaAar \
              > /tmp/aar-env-override-check.log 2>&1; then
            echo "error: ORG_GRADLE_PROJECT_* environment variables redirected the AAR integrity gate." >&2
            exit 1
          fi
          grep -q 'Unsupported sherpa-onnx AAR integrity override' /tmp/aar-env-override-check.log
      - name: Assert release builds depend on the gate
        working-directory: artifacts/weather-app/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :daymark-voice:assembleRelease --dry-run | tee /tmp/release-tasks.txt
          grep -q 'verifySherpaAar' /tmp/release-tasks.txt
      - name: Assert app release builds depend on the gate
        working-directory: artifacts/weather-app/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :app:preReleaseBuild --dry-run | tee /tmp/app-prerelease-tasks.txt
          grep -q ':daymark-voice:verifySherpaAar' /tmp/app-prerelease-tasks.txt
          ./gradlew --no-daemon --console=plain :app:assembleRelease --dry-run | tee /tmp/app-release-tasks.txt
          grep -q ':daymark-voice:verifySherpaAar' /tmp/app-release-tasks.txt
      - name: Assert debug builds and unit tests are not wired
        working-directory: artifacts/weather-app/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain :daymark-voice:preDebugBuild --dry-run > /tmp/debug-tasks.txt
          if grep -q 'verifySherpaAar' /tmp/debug-tasks.txt; then
            echo "error: the AAR integrity gate is wired into a debug build path." >&2
            exit 1
          fi
          ./gradlew --no-daemon --console=plain :app:assembleDebug --dry-run > /tmp/app-debug-tasks.txt
          if grep -q 'verifySherpaAar' /tmp/app-debug-tasks.txt; then
            echo "error: the AAR integrity gate is wired into the app debug build." >&2
            exit 1
          fi

  verify:
    name: verify
    if: always()
    needs: [preflight, classify-model-dependency, model-independent, model-dependent, android, codeql-javascript, codeql-java, aar-digest-and-tests, release-wiring]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate all release-candidate gates
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          CLASSIFY: ${{ needs.classify-model-dependency.result }}
          INDEPENDENT: ${{ needs.model-independent.result }}
          MODEL: ${{ needs.model-dependent.result }}
          ANDROID: ${{ needs.android.result }}
          CODEQL_JS: ${{ needs.codeql-javascript.result }}
          CODEQL_JAVA: ${{ needs.codeql-java.result }}
          AAR: ${{ needs.aar-digest-and-tests.result }}
          WIRING: ${{ needs.release-wiring.result }}
        run: |
          set -euo pipefail
          fail=0
          for item in "preflight:$PREFLIGHT" "classifier:$CLASSIFY" "model-independent:$INDEPENDENT" "model-dependent:$MODEL" "android-ci:$ANDROID" "codeql-javascript:$CODEQL_JS" "codeql-java:$CODEQL_JAVA" "aar-digest-and-tests:$AAR" "release-wiring:$WIRING"; do
            name=${item%%:*}
            result=${item#*:}
            echo "$name=$result"
            if [ "$result" != "success" ]; then
              echo "::error::$name gate result is $result"
              fail=1
            fi
          done
          { echo "## Exact-SHA verification aggregate"; echo "- candidate: 8a28892fec6903b765882a8ee5bf470ce6f0200b"; echo "- all gates: $([ "$fail" -eq 0 ] && echo PASS || echo FAIL)"; } >> "$GITHUB_STEP_SUMMARY"
          test "$fail" -eq 0
