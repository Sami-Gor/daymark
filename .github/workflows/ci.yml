name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run for the same ref instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung Gradle or Playwright step should fail the run, not occupy a
    # runner for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # SHA-pinned third-party action; b906aff is the v4 tag commit.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        env:
          PORT: 5173
          BASE_PATH: /

      # Capacitor 8 Android modules compile with Java 21.
      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Generate the Capacitor-managed Android files that are not committed
      # (including capacitor-cordova-android-plugins/cordova.variables.gradle).
      # This must happen before the unit tests: the network-boundary guard reads
      # the bundled WebView index.html and capacitor.config.json.
      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android

      # Capacitor writes the web build into Android assets. Fail before any
      # Gradle packaging if the copied inventory or hashes do not match dist.
      - name: Verify Android web assets
        run: pnpm --filter @workspace/weather-app run verify:android-web-assets

      - name: Unit tests
        run: pnpm --filter @workspace/weather-app run test

      # The sherpa-onnx runtime is a compile-time dependency of the
      # DaymarkVoice module: the Parakeet plugin imports its classes, so the
      # build cannot compile without it. The runtime is not committed; it is
      # fetched here and its checksum is verified by the script.
      - name: Fetch the sherpa-onnx runtime
        run: android/kokoro-poc/scripts/fetch-sherpa-onnx.sh

      # Run JVM checks before downloading the large install-time model pack.
      - name: Android unit tests
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :daymark-voice:testDebugUnitTest

      # The APK build runs the Parakeet asset guard. Fetch the pinned model
      # archive and verify the archive and all four extracted files first.
      - name: Fetch and verify Parakeet model assets
        run: android/kokoro-poc/scripts/fetch-parakeet-assets.sh

      - name: Android debug build and lint
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug

      - name: Install Playwright browser
        run: pnpm --filter @workspace/weather-app exec playwright install chromium --with-deps

      - name: Browser tests
        run: pnpm --filter @workspace/weather-app run test:e2e
        env:
          PORT: 5173
          BASE_PATH: /
          CI: 1

      # Fail on criticals; highs in dev-only chains (e.g. vite tooling) are
      # tolerated — verify reachability before bumping this to high.
      - name: Dependency audit
        run: pnpm audit --audit-level critical
