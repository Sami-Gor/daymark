name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run for the same ref instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung Gradle or Playwright step should fail the run, not occupy a
    # runner for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # SHA-pinned third-party action; b906aff is the v4 tag commit.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Type-aware async safety for the Playwright E2E suite (no-floating-promises,
      # no-misused-promises). Deliberately-invalid fixtures are ignored by this
      # target; tests/e2e/support/eslint-guard.test.ts proves the rules fire.
      - name: Lint E2E async safety
        run: pnpm --filter @workspace/weather-app run lint:e2e

      - name: Build
        run: pnpm run build
        env:
          PORT: 5173
          BASE_PATH: /

      # Capacitor 8 Android modules compile with Java 21.
      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Generate the Capacitor-managed Android files that are not committed
      # (including capacitor-cordova-android-plugins/cordova.variables.gradle).
      # This must happen before the unit tests: the network-boundary guard reads
      # the bundled WebView index.html and capacitor.config.json.
      - name: Sync Capacitor Android project
        run: pnpm --filter @workspace/weather-app exec cap sync android

      # Capacitor writes the web build into Android assets. Fail before any
      # Gradle packaging if the copied inventory or hashes do not match dist.
      - name: Verify Android web assets
        run: pnpm --filter @workspace/weather-app run verify:android-web-assets

      - name: Unit tests
        run: pnpm --filter @workspace/weather-app run test

      # The sherpa-onnx runtime is a compile-time dependency of the
      # DaymarkVoice module: the Parakeet plugin imports its classes, so the
      # build cannot compile without it. The runtime is not committed; it is
      # fetched here and its checksum is verified by the script.
      - name: Fetch the sherpa-onnx runtime
        run: android/kokoro-poc/scripts/fetch-sherpa-onnx.sh

      # The Parakeet model is not committed. Fetch the pinned archive and
      # verify all four model hashes before Gradle packages the debug APK/AAB.
      # The asset-pack ownership and integrity guards remain active.
      - name: Fetch Parakeet model assets
        run: android/kokoro-poc/scripts/fetch-parakeet-assets.sh

      # Compile the native Android modules as well as the web layer. This
      # catches Java/API/manifest regressions in Capacitor plugin changes.
      # The committed JVM unit tests guard the minimum-WebView gate that
      # decides whether the WebView loads the bundle at all. One Gradle
      # invocation rather than a second step avoids a redundant
      # configuration phase and keeps both tasks on one resolved classpath.
      # The DaymarkVoice module's own tests (permission lifecycle, model
      # integrity, endpoint detection) and app lint run in the same
      # invocation so those regressions cannot merge silently.
      - name: Android build and unit tests
        working-directory: artifacts/weather-app/android
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleDebug :app:testDebugUnitTest :daymark-voice:testDebugUnitTest :app:lintDebug

      - name: Install Playwright browser
        run: pnpm --filter @workspace/weather-app exec playwright install chromium --with-deps

      - name: Browser tests
        run: pnpm --filter @workspace/weather-app run test:e2e
        env:
          PORT: 5173
          BASE_PATH: /
          CI: 1

      # Fail on criticals; highs in dev-only chains (e.g. vite tooling) are
      # tolerated — verify reachability before bumping this to high.
      - name: Dependency audit
        run: pnpm audit --audit-level critical
