name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run for the same ref instead of letting both finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung Gradle or Playwright step should fail the run, not occupy a
    # runner for the default six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # SHA-pinned third-party action; b906aff is the v4 tag commit.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
        env:
          PORT: 5173
          BASE_PATH: /

      - name: Unit tests
        run: pnpm --filter @workspace/weather-app run test

      - name: Install Playwright browser
        run: pnpm --filter @workspace/weather-app exec playwright install chromium --with-deps

      - name: Browser tests
        run: pnpm --filter @workspace/weather-app run test:e2e
        env:
          PORT: 5173
          BASE_PATH: /
          CI: 1

      # Fail on criticals; highs in dev-only chains (e.g. vite tooling) are
      # tolerated — verify reachability before bumping this to high.
      - name: Dependency audit
        run: pnpm audit --audit-level critical
