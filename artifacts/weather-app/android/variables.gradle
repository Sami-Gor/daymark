ext {
    // Daymark V2 baseline is Android 10 (API 29); Capacitor 8 minimum is API 24.
    minSdkVersion = 29
    compileSdkVersion = 36
    targetSdkVersion = 36
    // The NDK the Kokoro JNI library is cross-compiled with
    // (android/kokoro-poc/scripts/build-kokoro-android.sh). Declaring it here
    // means Gradle resolves the same NDK instead of falling back to the
    // Android Gradle plugin's default, which is not installed and leaves the
    // build without the strip/objcopy tools it needs to extract and package
    // native debug symbols.
    ndkVersion = '29.0.14206865'
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}