apply plugin: 'com.android.application'

android {
    namespace = "io.github.sami_gor.daymark"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    // The Parakeet speech model is delivered as an install-time Play asset
    // pack, because it does not fit in the base module's size limit.
    assetPacks = [":parakeet-assets"]

    defaultConfig {
        applicationId (project.findProperty("daymarkApplicationId") ?: "io.github.sami_gor.daymark")
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // The shipped native stack is arm64-only: Kokoro JNI is arm64-only, and
        // the prebuilt sherpa AAR otherwise contributes armeabi-v7a/x86/x86_64
        // libraries that cannot run the voice engine. Restrict every ABI here
        // so the app bundle cannot install a partially native-compatible build.
        //
        // -PdaymarkTestAbi=<abi> overrides the single ABI for test/CI builds
        // that must run on an ABI the shipped stack does not cover (the
        // x86_64 Android 11 emulator of the API 30 location smoke workflow).
        // Production never sets it, and such builds ship without
        // libkokoro_jni.so on purpose: DaymarkVoicePlugin degrades to
        // "voice unavailable" instead of using the library.
        ndk {
            abiFilters ((project.findProperty("daymarkTestAbi") ?: "arm64-v8a") as String)
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file('keystore.properties')
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            // Ship native debug symbols with the App Bundle so Google Play can
            // symbolicate native crash and ANR stack traces. SYMBOL_TABLE keeps
            // function names without the extra size of FULL file-and-line
            // information.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    androidResources {
        // The Kokoro model and voice must stay uncompressed: the engine streams
        // them out of the APK assets on first initialization.
        noCompress += ['onnx', 'bin']
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':daymark-voice')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
