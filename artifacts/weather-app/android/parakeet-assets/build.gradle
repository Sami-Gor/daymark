apply plugin: 'com.android.asset-pack'

// Play Asset Delivery pack for the on-device speech model.
//
// The Parakeet TDT 0.6B v3 int8 weights are about 456 MiB compressed, which
// does not fit inside Google Play's 500 MB base-module limit together with the
// rest of the app. They are delivered here as an install-time asset pack
// instead: Google Play installs the pack together with the app, so the model
// is on the device and available offline once the install has finished.
//
// An install-time pack is used deliberately. An on-demand or fast-follow pack
// would leave the model absent until the app downloaded it, which would need a
// network connection and would break the promise that voice input works
// offline.

assetPack {
    packName = "parakeet"
    dynamicDelivery {
        deliveryType = "install-time"
    }
}
