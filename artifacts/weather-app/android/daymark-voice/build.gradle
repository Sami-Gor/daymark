apply plugin: 'com.android.library'

android {
    namespace = "io.github.sami_gor.daymark.voice"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // The validated Kokoro JNI library is built for arm64-v8a only.
            // -PdaymarkTestAbi=<abi> overrides the ABI for test/CI builds
            // that run on a different emulator ABI; those builds deliberately
            // have no libkokoro_jni.so and rely on the graceful-degradation
            // path (see KokoroNativeLibrary) instead.
            abiFilters ((project.findProperty("daymarkTestAbi") ?: "arm64-v8a") as String)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capacitor-android')

    // sherpa-onnx runs the Parakeet TDT 0.6B v3 int8 model on the device.
    // The runtime is fetched by android/kokoro-poc/scripts/fetch-sherpa-onnx.sh
    // and is not committed; the abiFilters above keep only the arm64-v8a
    // native libraries in the shipped bundle.
    implementation files('libs/sherpa-onnx-1.13.8.aar')

    testImplementation "junit:junit:$junitVersion"
}
