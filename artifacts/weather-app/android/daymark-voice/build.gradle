apply plugin: 'com.android.library'

android {
    namespace = "io.github.sami_gor.daymark.voice"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // The validated Kokoro JNI library is built for arm64-v8a only.
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capacitor-android')

    // sherpa-onnx runs the Parakeet TDT 0.6B v3 int8 model on the device.
    // This is the verified, committed CVE-2026-108954 build. The fetch script
    // validates its pin; the abiFilters above keep only the arm64-v8a native
    // libraries in the shipped bundle.
    implementation files('libs/sherpa-onnx-1.13.8-daymark-cve-2026-108954.aar')

    testImplementation "junit:junit:$junitVersion"
}
