apply plugin: 'com.android.library'

/*
 * Optional narration pack source configuration (Agent C).
 *
 * These values are compiled into BuildConfig, never read from the web layer or
 * a runtime preference. The public Ed25519 key is the only key material in the
 * build: the matching private key belongs to release tooling and must never be
 * committed. Debug builds point at the development pack host; release builds
 * are intentionally EMPTY by default so PackSourceConfig fails closed
 * (packs-unconfigured) until release engineering supplies the production host
 * and public key with -PdaymarkReleasePackBaseUrl / -PdaymarkReleasePackTrustAnchor.
 */
def packConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def packProperty = { String name, String fallback ->
    (project.findProperty(name) ?: fallback).toString()
}
def debugPackBaseUrl = packProperty(
        'daymarkPackBaseUrl', 'https://packs.dev.daymark.app/v21')
def debugPackTrustAnchor = packProperty(
        'daymarkPackTrustAnchor',
        '2913931e905640452ad0498185e5bd928c1ca6444908094e872a2f9d24605102')
def debugPackAllowedVoices = packProperty(
        'daymarkPackAllowedVoices', 'ff_siwis')
def releasePackBaseUrl = packProperty('daymarkReleasePackBaseUrl', '')
def releasePackTrustAnchor = packProperty('daymarkReleasePackTrustAnchor', '')
def releasePackAllowedVoices = packProperty('daymarkReleasePackAllowedVoices', '')

android {
    namespace = "io.github.sami_gor.daymark.voice"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // The validated Kokoro JNI library is built for arm64-v8a only.
            abiFilters 'arm64-v8a'
        }
    }

    buildFeatures {
        // The narration gate is compiled into the variant, not read from the
        // web layer or a runtime setting.
        buildConfig true
    }

    buildTypes {
        debug {
            // Multilingual narration is the debug-POC capability. Debug
            // packages ff_siwis/em_alex from src/debug/assets.
            buildConfigField "boolean", "MULTILINGUAL_NARRATION", "true"
            buildConfigField "boolean", "PACKAGED_MULTILINGUAL_VOICES", "true"
            // Development builds may exercise em_alex locally.
            buildConfigField "boolean", "SPANISH_VOICE_DISTRIBUTION_APPROVED", "true"
            // Development pack source. The public anchor is safe to ship in a
            // debug variant; its private half is provisioned out-of-band and is
            // not in this repository.
            buildConfigField "String", "PACK_BASE_URL", packConfigString(debugPackBaseUrl)
            buildConfigField "String", "PACK_TRUST_ANCHOR", packConfigString(debugPackTrustAnchor)
            buildConfigField "String", "PACK_ALLOWED_VOICE_IDS", packConfigString(debugPackAllowedVoices)
        }
        release {
            // V2.1 ships multilingual narration, but the base APK packages only
            // the English voice; French/Spanish voices arrive via optional packs
            // and are gated by installed-voice checks in NarrationVoicePolicy.
            buildConfigField "boolean", "MULTILINGUAL_NARRATION", "true"
            buildConfigField "boolean", "PACKAGED_MULTILINGUAL_VOICES", "false"
            // Release distribution of em_alex is blocked until written speaker
            // rights evidence exists; flip only after that evidence is recorded.
            buildConfigField "boolean", "SPANISH_VOICE_DISTRIBUTION_APPROVED", "false"
            // Fail closed: release builds ship no pack source until release
            // engineering injects the production host and public key. An empty
            // configuration makes PackSourceConfig throw packs-unconfigured.
            buildConfigField "String", "PACK_BASE_URL", packConfigString(releasePackBaseUrl)
            buildConfigField "String", "PACK_TRUST_ANCHOR", packConfigString(releasePackTrustAnchor)
            buildConfigField "String", "PACK_ALLOWED_VOICE_IDS", packConfigString(releasePackAllowedVoices)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':capacitor-android')

    // sherpa-onnx runs the Parakeet TDT 0.6B v3 int8 model on the device.
    // This is the verified, committed CVE-2026-108954 build. The fetch script
    // validates its pin; the abiFilters above keep only the arm64-v8a native
    // libraries in the shipped bundle.
    implementation files('libs/sherpa-onnx-1.13.8-daymark-cve-2026-108954.aar')

    testImplementation "junit:junit:$junitVersion"
}

/*
 * Assert the compiled narration gate, not merely the text in this file.
 * A finalizer on BuildConfig generation checks the generated Java for the
 * variant, so a missing/renamed field or a mistaken build-type assignment
 * fails the build.
 */
def verifyMultilingualGate = { String variant, boolean expected ->
    def taskName = "verify${variant.capitalize()}MultilingualGate"
    tasks.register(taskName) {
        group = 'verification'
        description = "Fails unless ${variant} compiles MULTILINGUAL_NARRATION = ${expected}."
        doLast {
            def generated = fileTree("$buildDir/generated/source/buildConfig/$variant") {
                include '**/BuildConfig.java'
            }.files
            def buildConfig = generated.find { it.text.contains('MULTILINGUAL_NARRATION') }
            if (buildConfig == null) {
                throw new GradleException(
                        "No ${variant} BuildConfig.java with MULTILINGUAL_NARRATION was generated.")
            }
            def expectedLine = "MULTILINGUAL_NARRATION = ${expected}"
            if (!buildConfig.text.contains(expectedLine)) {
                throw new GradleException(
                        "${variant} BuildConfig does not compile ${expectedLine}: " +
                        "multilingual narration gate is not enforced.")
            }
            logger.lifecycle("${variant} narration gate verified: ${expectedLine}")
        }
    }
    tasks.matching { it.name == "generate${variant.capitalize()}BuildConfig" }.configureEach {
        finalizedBy taskName
    }
}

verifyMultilingualGate('debug', true)
// V2.1 enables multilingual narration in release; the base APK still packages
// only English (PACKAGED_MULTILINGUAL_VOICES=false), so optional voices must be
// installed before they can be selected.
verifyMultilingualGate('release', true)
