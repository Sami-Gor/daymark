apply plugin: 'com.android.library'

android {
    namespace = "io.github.sami_gor.daymark.voice"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // The validated Kokoro JNI library is built for arm64-v8a only.
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Fail-closed SHA-256 verification of the committed sherpa-onnx runtime.
// The pin lives in sherpa-aar.sha256 next to this file and is shared with
// android/kokoro-poc/scripts/fetch-sherpa-onnx.sh and CI. The plugin registers
// verifySherpaAar and wires it into every release build; debug builds and JVM
// unit tests are unaffected. It also requires the pin to name exactly the AAR
// packaged below, so the pin cannot be pointed at a different artifact. See
// gradle/sherpa-aar-integrity.gradle.
apply from: '../gradle/sherpa-aar-integrity.gradle'

dependencies {
    implementation project(':capacitor-android')

    // sherpa-onnx runs the Parakeet TDT 0.6B v3 int8 model on the device.
    // This is the verified, committed CVE-2026-108954 build with the Daymark
    // joiner-width (0001) and NeMo encoder-output (0002) validation patches.
    // The fetch script and SHA256SUMS validate its pin; the abiFilters above
    // keep only the arm64-v8a native libraries in the shipped bundle.
    implementation files("libs/${sherpaAarPackagedName}")

    testImplementation "junit:junit:$junitVersion"
    // The Android `org.json` stub throws in local unit tests. The bridge error
    // payload is part of the error contract, so the JVM tests assert its exact
    // shape with the real implementation on the test classpath.
    testImplementation 'org.json:json:20240303'
}
