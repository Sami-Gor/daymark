apply plugin: 'com.android.library'

android {
    namespace = "io.github.sami_gor.daymark.voice"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            // The validated Kokoro JNI library is built for arm64-v8a only.
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Fail-closed SHA-256 verification of the committed sherpa-onnx runtime.
// The pin lives in sherpa-aar.sha256 next to this file and is shared with
// android/kokoro-poc/scripts/fetch-sherpa-onnx.sh and CI. The plugin registers
// verifySherpaAar and wires it into every release build; debug builds and JVM
// unit tests are unaffected. See gradle/sherpa-aar-integrity.gradle.
apply from: '../gradle/sherpa-aar-integrity.gradle'

dependencies {
    implementation project(':capacitor-android')

    // sherpa-onnx runs the Parakeet TDT 0.6B v3 int8 model on the device.
    // This is the verified, committed CVE-2026-108954 build. The fetch script
    // validates its pin; the abiFilters above keep only the arm64-v8a native
    // libraries in the shipped bundle.
    implementation files('libs/sherpa-onnx-1.13.8-daymark-cve-2026-108954.aar')

    testImplementation "junit:junit:$junitVersion"
}
