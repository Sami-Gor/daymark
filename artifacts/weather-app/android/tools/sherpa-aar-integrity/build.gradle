// Test harness for gradle/sherpa-aar-integrity.gradle.
//
// run-tests.sh stages the AAR and pin into work/ and then runs the single
// real task this project exposes. The inputs are read from the staged copy so
// that the negative cases (missing AAR, mutated bytes, wrong pin) never touch
// the committed artifact.
//
// Nothing here is part of the Android build: this directory is not included
// from ../settings.gradle.

ext.sherpaAarDir = file('work/aar')
ext.sherpaAarPinFile = file('work/sherpa-aar.sha256')

apply from: '../../gradle/sherpa-aar-integrity.gradle'

// Tasks with the names the Android Gradle plugin creates, so the release-only
// wiring can be asserted with --dry-run. They are registered after the plugin
// is applied on purpose: the plugin must catch tasks that appear later.
tasks.register('preReleaseBuild')
tasks.register('assembleRelease')
tasks.register('packageReleaseAar')
tasks.register('preDebugBuild')
tasks.register('testDebugUnitTest')
tasks.register('lintDebug')
